name: Build, Publish, and Release

on:
  push:
    # This ensures the workflow only runs when you push a tag like 'v1.0.0'
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  # Converts the github.repository (o51r15/inspectarr) into the image name
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-push-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # Needed to create the GitHub Release
      packages: write    # Needed to push the Docker image to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up QEMU and Buildx for multi-platform builds (if you want ARM/Raspberry Pi support later)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN is automatically provided by Actions
          password: ${{ secrets.GITHUB_TOKEN }}

      # Automatically generate tags based on the Git tag (e.g., v1.0.0 -> 1.0.0 and latest)
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      # Build the image and push it to ghcr.io
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Add linux/arm64 below if you want to support Raspberry Pi/ARM instances
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Automatically generate a GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
