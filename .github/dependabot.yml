# Keeps pinned versions from silently going stale.
#
# The Dockerfile's base image sat two years behind (3.12.2 / bookworm) before
# Phase 0 noticed, and every GitHub Action here still targeted the deprecated
# Node.js 20 runtime. Dependabot opens a pull request per update, with the
# upstream changelog attached, and release.yml tests and builds each one
# (both architectures, nothing published) before it can be merged.
version: 2
updates:
  # GitHub Actions used by the workflows. Grouped so one PR moves them all.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # The python:3.12-slim base image. Dependabot understands digest pins and
  # proposes the new digest while keeping the 3.12 tag.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # A Python minor upgrade (3.12 -> 3.13) is a deliberate decision, not
      # routine maintenance.
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    commit-message:
      prefix: build

  # Runtime and dev dependencies in requirements*.txt.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: deps
