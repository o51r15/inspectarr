# inspectarr — example configuration
# Copy this file to config.yaml and fill in your values.
# config.yaml is gitignored; this file is safe to commit.

# ---------------------------------------------------------------------------
# qBittorrent Web API v2
# ---------------------------------------------------------------------------
qbittorrent:
  url: http://192.168.1.100:8080
  username: admin
  password: changeme

# ---------------------------------------------------------------------------
# *arr clients
# Set enabled: true for each one you use and provide credentials.
# Rules reference arr clients by name (app: sonarr / app: radarr).
# ---------------------------------------------------------------------------
arrs:
  sonarr:
    enabled: true
    url: http://192.168.1.100:8989
    api_key: your_sonarr_api_key_here
  radarr:
    enabled: false                    # Set to true and add credentials to use
    url: http://192.168.1.100:7878
    api_key: ~
  lidarr:
    enabled: false                    # Set to true and add credentials to use
    url: http://192.168.1.100:8686
    api_key: ~

# ---------------------------------------------------------------------------
# Rules
# Each rule targets one qBittorrent category and one arr app.
# Multiple rules are supported — e.g. separate rules for TV vs Anime.
# ---------------------------------------------------------------------------
rules:
  - name: "TV Bad Extensions"
    category: "tv-sonarr"             # Must match exactly in qBittorrent
    app: sonarr
    conditions:
      match_mode: any                 # "any"     = flag if ANY file has a bad ext (default)
                                      # "primary" = flag only if the LARGEST file is bad
      bad_extensions:
        - ".exe"
        - ".zip"
        - ".bat"
        - ".msi"
        - ".js"
        - ".vbs"
        - ".dmg"
        - ".rar"
      # Optional: flag if the primary (largest) file is suspiciously small
      # min_file_size_mb: 100
      # Optional: flag if any filename matches these regex patterns (respects match_mode)
      # bad_filename_patterns:
      #   - "sample\."         # filename contains "sample."
      #   - "^(?!.*\d{3,})"    # primary file has no episode/quality number

  # Example: second rule for an anime category
  # - name: "Anime Bad Extensions"
  #   category: "anime-sonarr"
  #   app: sonarr
  #   conditions:
  #     match_mode: any
  #     bad_extensions: [".exe", ".bat", ".msi"]

# ---------------------------------------------------------------------------
# Failure handling
# What to do if the arr API call fails:
#   delete — delete from qBittorrent anyway, log + notify the arr failure
#   abort  — skip qBittorrent deletion, queue for retry
# ---------------------------------------------------------------------------
on_arr_failure: delete

# ---------------------------------------------------------------------------
# Retry
# On any failure, inspectarr queues the torrent for retry.
# Each startup processes any retries that are now due.
# ---------------------------------------------------------------------------
retry:
  enabled: true
  max_attempts: 10
  interval_seconds: 600             # 10 minutes between attempts

# ---------------------------------------------------------------------------
# Logging
# JSON Lines format. One event object per line.
# Retention prunes both the log file and the SQLite state on every startup.
# ---------------------------------------------------------------------------
logging:
  log_file: ./data/inspectarr.log.json
  retention_days: 30
  level: INFO                       # DEBUG for verbose output

# ---------------------------------------------------------------------------
# State (SQLite)
# Tracks processed hashes and the retry queue.
# ---------------------------------------------------------------------------
state:
  db_file: ./data/inspectarr.db

# ---------------------------------------------------------------------------
# Notifications — Pushover
# Remove any event types from notify_on that you don't want alerts for.
# Priority: -2=silent, -1=quiet, 0=normal, 1=high, 2=emergency
# ---------------------------------------------------------------------------
notifications:
  pushover:
    enabled: false                  # Set to true and fill credentials to activate
    app_token: your_pushover_app_token
    user_key:  your_pushover_user_key
    notify_on:
      - action                      # A torrent was deleted and blocklisted
      - error                       # Any API failure or unhandled exception
      - startup                     # inspectarr started successfully
      - dry_run                     # A match was found but dry_run prevented action
    priority: 0

# ---------------------------------------------------------------------------
# Dry run
# true  = log and notify matches but do NOT delete or blocklist anything
# false = live mode (default)
# Can also be set at runtime with: python watchdog.py --dry-run
# ---------------------------------------------------------------------------
dry_run: false

# ---------------------------------------------------------------------------
# Poll interval (seconds) — used by the web UI scheduler daemon
# The CLI single-shot mode ignores this value.
# ---------------------------------------------------------------------------
poll_interval_seconds: 300

# ---------------------------------------------------------------------------
# Prowlarr indexer health scoring (optional)
# When enabled, Inspectarr scores torrent indexers by response time, failure
# rate, and malicious content served, then auto-reorders them in Prowlarr.
# NZB indexers are never touched.
# ---------------------------------------------------------------------------
prowlarr:
  enabled: false
  url: http://192.168.1.x:9696/prowlarr   # Include URL base if set in Prowlarr
  api_key: ~
  base_priority: 10            # Best-scoring torrent indexer gets this priority; others count up from here
  reorder_interval_hours: 24   # How often to auto-reorder (runs via web scheduler)
  history_window_days: 90      # Rolling window for response time + failure rate
  min_grabs_before_scoring: 10 # Minimum history records before scoring an indexer
  scoring:
    response_time_weight: 0.35
    failure_rate_weight: 0.40
    malicious_weight: 0.25
    backoff_penalty: 20          # Points deducted if currently in Prowlarr backoff
    malicious_penalty_per_hit: 10  # Points deducted per confirmed malicious torrent

# ---------------------------------------------------------------------------
# Web UI
# ---------------------------------------------------------------------------
web:
  port: 8585
  scheduler_autostart: false        # Set to true to start the scheduler automatically on launch
  auth:
    enabled: false                  # Set to true to password-protect the web UI
    username: admin
    password: changeme
