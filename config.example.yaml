# inspectarr — example configuration
# Copy this file to config.yaml and fill in your values.
# config.yaml is gitignored; this file is safe to commit.

# ---------------------------------------------------------------------------
# qBittorrent Web API v2
# ---------------------------------------------------------------------------
qbittorrent:
  url: http://192.168.1.100:8080
  username: admin
  password: changeme

# ---------------------------------------------------------------------------
# *arr clients
# Set enabled: true for each one you use and provide credentials.
# Rules reference arr clients by name (app: sonarr / app: radarr).
# ---------------------------------------------------------------------------
arrs:
  sonarr:
    enabled: true
    url: http://192.168.1.100:8989
    api_key: your_sonarr_api_key_here
  radarr:
    enabled: false                    # Set to true and add credentials to use
    url: http://192.168.1.100:7878
    api_key: ~
  lidarr:
    enabled: false                    # Set to true and add credentials to use
    url: http://192.168.1.100:8686
    api_key: ~

# ---------------------------------------------------------------------------
# Rules
# Each rule targets one qBittorrent category and one arr app.
# Multiple rules are supported — e.g. separate rules for TV vs Anime.
# ---------------------------------------------------------------------------
rules:
  - name: "TV Bad Extensions"
    category: "tv-sonarr"             # Must match exactly in qBittorrent
    app: sonarr
    conditions:
      match_mode: any                 # "any"     = flag if ANY file has a bad ext (default)
                                      # "primary" = flag only if the LARGEST file is bad
      bad_extensions:
        - ".exe"
        - ".zip"
        - ".bat"
        - ".msi"
        - ".js"
        - ".vbs"
        - ".dmg"
        - ".rar"
      # Optional: flag if the primary (largest) file is suspiciously small
      # min_file_size_mb: 100
      # Optional: flag if any filename matches these regex patterns (respects match_mode)
      # bad_filename_patterns:
      #   - "sample\."         # filename contains "sample."
      #   - "^(?!.*\d{3,})"    # primary file has no episode/quality number

  # Example: second rule for an anime category
  # - name: "Anime Bad Extensions"
  #   category: "anime-sonarr"
  #   app: sonarr
  #   conditions:
  #     match_mode: any
  #     bad_extensions: [".exe", ".bat", ".msi"]

# ---------------------------------------------------------------------------
# Failure handling
# What to do if the arr API call fails:
#   delete — delete from qBittorrent anyway, log + notify the arr failure
#   abort  — skip qBittorrent deletion, queue for retry
# ---------------------------------------------------------------------------
on_arr_failure: delete

# ---------------------------------------------------------------------------
# Retry
# On any failure, inspectarr queues the torrent for retry.
# Each startup processes any retries that are now due.
# ---------------------------------------------------------------------------
retry:
  enabled: true
  max_attempts: 10
  interval_seconds: 600             # 10 minutes between attempts

# ---------------------------------------------------------------------------
# Logging
# JSON Lines format. One event object per line.
# Retention prunes both the log file and the SQLite state on every startup.
# ---------------------------------------------------------------------------
logging:
  log_file: ./data/inspectarr.log.json
  retention_days: 30
  level: INFO                       # DEBUG for verbose output

# ---------------------------------------------------------------------------
# State (SQLite)
# Tracks processed hashes and the retry queue.
# ---------------------------------------------------------------------------
state:
  db_file: ./data/inspectarr.db

# ---------------------------------------------------------------------------
# Notifications — Apprise (supports 100+ services)
# URLs follow Apprise format: https://github.com/caronc/apprise/wiki
# Examples:
#   - pover://user@token                      (Pushover)
#   - tgram://bottoken/ChatID                  (Telegram)
#   - discord://webhook_id/webhook_token       (Discord)
#   - slack://tokenA/tokenB/tokenC/#channel    (Slack)
# ---------------------------------------------------------------------------
notifications:
  apprise:
    enabled: false                  # Set to true and add URLs to activate
    urls:
      # - pover://user@token
      # - tgram://bottoken/ChatID
    notify_on:
      - action                      # A torrent was deleted and blocklisted
      - error                       # Any API failure or unhandled exception
      - startup                     # inspectarr started successfully
      - dry_run                     # A match was found but dry_run prevented action
  # Notification digest — batch notifications instead of sending individually
  digest:
    enabled: false
    use_ollama: false               # Use Ollama to generate digest summaries
  # Periodic log summary — generates a summary of recent activity
  summary:
    enabled: false
    schedule: daily                 # "daily" or "weekly"
    use_ollama: true                # Use Ollama to generate natural-language summaries

# ---------------------------------------------------------------------------
# Remediation severity (ROADMAP item 24)
#
# Every rule match is assigned a severity per finding, then aggregated with
# MAX -- one executable is never diluted by a pile of low-severity noise.
#
# Built-in classification:
#   executables/scripts (.exe .bat .msi .js .vbs .dmg .scr .lnk ...) CRITICAL
#   archives            (.zip .rar .7z .iso ...)                     HIGH
#   undersized primary file (min_file_size_mb)                       HIGH
#   filename pattern match                                           MEDIUM
#   any other flagged extension                                      MEDIUM
# ---------------------------------------------------------------------------
remediation:
  # Lowest severity that still gets acted on. LOW means "act on everything",
  # which is the behaviour from before severity existed -- so leaving this
  # alone changes nothing.
  #
  # Raise to HIGH to stop auto-deleting matches whose worst finding is only
  # an archive or a filename heuristic, while still acting on anything that
  # finds an executable. Anything below the floor is still inspected,
  # recorded and visible -- it simply is not deleted.
  min_severity: LOW           # LOW | MEDIUM | HIGH | CRITICAL

  # Lowest severity that gets DELETED. Together with min_severity this makes
  # three bands:
  #
  #   below min_severity            -> recorded only, no action
  #   min_severity .. remediate_at  -> QUARANTINE (paused, held for review)
  #   remediate_at and above        -> blocklisted and deleted
  #
  # Also LOW by default, which collapses the quarantine band to nothing and
  # reproduces the behaviour from before quarantine existed: everything
  # flagged is deleted.
  #
  # Example: remediate_at: CRITICAL holds .rar/.zip catches on the Quarantine
  # page for review while still deleting anything containing an executable.
  remediate_at: LOW           # LOW | MEDIUM | HIGH | CRITICAL

  # How a hold ends without a human. 0 = hold indefinitely (default) -- a
  # quarantined torrent waits for a decision rather than being resolved by a
  # timer.
  quarantine_timeout_minutes: 0

  # What an elapsed timeout does: "release" (resume the download) or
  # "remediate" (blocklist and delete). Defaults to release, because a timer
  # expiring means nobody looked -- which is not the same as deciding the
  # torrent was malicious.
  quarantine_timeout_action: release

  # Reclassify specific extensions or signals. Extension keys (leading dot)
  # win over signal keys.
  severity_overrides: {}
  #   ".rar": LOW                     # RAR is normal in your library
  #   ".iso": CRITICAL                # but a disc image never is
  #   "bad_filename_pattern": LOW     # trust your patterns less

# ---------------------------------------------------------------------------
# Dry run
# true  = log and notify matches but do NOT delete or blocklist anything
# false = live mode (default)
# Can also be set at runtime with: python watchdog.py --dry-run
# ---------------------------------------------------------------------------
dry_run: false

# ---------------------------------------------------------------------------
# Scanning — controls how and when inspectarr checks for new torrents
# Replaces the legacy poll_interval_seconds key.
# ---------------------------------------------------------------------------
scanning:
  polling:
    enabled: true
    interval_seconds: 300           # Seconds between scheduled scans
  webhooks:
    enabled: false                  # Accept incoming webhooks from *arr apps
    secret: ""                      # Shared secret for HMAC validation (optional)
    scan_delay_seconds: 60          # Delay after webhook before scanning (debounce)

# ---------------------------------------------------------------------------
# Prowlarr indexer health scoring (optional)
# When enabled, Inspectarr scores torrent indexers by response time, failure
# rate, and malicious content served, then auto-reorders them in Prowlarr.
# NZB indexers are never touched.
# ---------------------------------------------------------------------------
prowlarr:
  enabled: false
  url: http://192.168.1.x:9696/prowlarr   # Include URL base if set in Prowlarr
  api_key: ~
  base_priority: 10            # Best-scoring torrent indexer gets this priority; others count up from here
  reorder_interval_hours: 24   # How often to auto-reorder (runs via web scheduler)
  min_grabs_before_scoring: 10 # Minimum history records before scoring an indexer
  scoring:
    response_time_weight: 0.25   # Weight for response time sub-score
    failure_rate_weight: 0.30    # Weight for weighted failure rate sub-score
    malicious_weight: 0.20       # Weight for malicious content rate sub-score
    grab_success_weight: 0.25    # Weight for grab success rate sub-score
    backoff_penalty: 20          # Points deducted if currently in Prowlarr backoff
    malicious_penalty_per_hit: 10  # Points deducted per confirmed malicious torrent
    # Failure type severity multipliers (higher = more weight in failure rate)
    auth_failure_mult: 3.0       # Auth failures are most severe
    grab_failure_mult: 2.0       # Grab failures
    query_failure_mult: 1.0      # Query failures (baseline)
    rss_failure_mult: 0.5        # RSS failures are least severe
  # Optional: AI-powered scoring via Ollama
  # When configured, Ollama analyzes all available indexer data and produces
  # the final health score. When not configured (or if Ollama is unreachable),
  # the deterministic formula above is used automatically as a fallback.
  ollama:
    # Master switch for every AI feature. Off by default -- AI is entirely
    # optional and a fresh install should not contact a model nobody set up.
    # While false, indexer AI scoring, AI notification digests and periodic
    # summaries are all skipped and no Ollama request is ever made.
    # Detection, severity and quarantine do not use AI and are unaffected.
    enabled: false               # master switch
    url: ""                      # e.g. http://192.168.1.125:11434
    model: ""                    # e.g. gemma3:latest — must be set explicitly
    timeout: 120                 # seconds — hard cutoff per scoring run
    cache_ttl_hours: 24          # How long to cache LLM scoring results
    system_prompt: ""            # Custom system prompt (empty = built-in default)
    update_check_hours: 24       # Check for model updates every N hours (0 = disable)
  # Automated indexer management
  # When enabled, indexers that drop below disable_threshold for consecutive_runs
  # scoring cycles are automatically disabled in Prowlarr, then re-enabled after
  # cooldown_hours.
  auto_manage:
    enabled: false
    disable_threshold: 30.0      # Health score below which an indexer is disabled
    consecutive_runs: 3          # Must fail this many cycles before auto-disable
    cooldown_hours: 24           # Hours before a disabled indexer is re-enabled

# ---------------------------------------------------------------------------
# Web UI
# ---------------------------------------------------------------------------
web:
  port: 8585
  scheduler_autostart: false        # Set to true to start the scheduler automatically on launch
  auth:
    enabled: false                  # Set to true to password-protect the web UI
    username: admin
    password: changeme
