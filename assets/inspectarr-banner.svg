<svg viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" fill="#090b0e"/>

  <!-- Subtle glow behind logo mark -->
  <ellipse cx="140" cy="110" rx="140" ry="110" fill="url(#glow)"/>

  <!-- Outer border -->
  <rect x="0.5" y="0.5" width="899" height="219" fill="none"
        stroke="rgba(45,212,191,0.18)" stroke-width="1"/>

  <!-- Logo mark — helm wheel + magnifying glass, scaled 1.85x, left side -->
  <g transform="translate(42, 18) scale(1.85)">
    <!-- Helm wheel: center (42,54), outer r=28, hub r=6.5 -->
    <circle cx="42" cy="54" r="28" fill="none" stroke="url(#g)" stroke-width="3.5"/>
    <circle cx="42" cy="54" r="6.5" fill="none" stroke="url(#g)" stroke-width="3.5"/>
    <!-- 8 spokes -->
    <line x1="42"   y1="47.5" x2="42"   y2="26"   stroke="url(#g)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="46.6" y1="49.4" x2="61.8" y2="34.2" stroke="url(#g)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="48.5" y1="54"   x2="70"   y2="54"   stroke="url(#g)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="46.6" y1="58.6" x2="61.8" y2="73.8" stroke="url(#g)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="42"   y1="60.5" x2="42"   y2="82"   stroke="url(#g)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="37.4" y1="58.6" x2="22.2" y2="73.8" stroke="url(#g)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="35.5" y1="54"   x2="14"   y2="54"   stroke="url(#g)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="37.4" y1="49.4" x2="22.2" y2="34.2" stroke="url(#g)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Magnifying glass -->
    <circle cx="66" cy="26" r="13" fill="none" stroke="url(#g)" stroke-width="3.5"/>
    <line x1="56.8" y1="35.2" x2="50" y2="42" stroke="url(#g)" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="60.5" cy="20" r="2.5" fill="#5eead4" opacity="0.55"/>
  </g>

  <!-- Vertical divider -->
  <line x1="232" y1="44" x2="232" y2="176"
        stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- Accent line above title -->
  <line x1="258" y1="76" x2="310" y2="76"
        stroke="#2dd4bf" stroke-width="1.5"/>

  <!-- App name -->
  <text x="258" y="148"
        font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif"
        font-size="76" font-weight="700" letter-spacing="-2.5"
        fill="#e2e8f0">inspectarr</text>

  <!-- Subtitle -->
  <text x="261" y="183"
        font-family="'Courier New', Consolas, 'Lucida Console', monospace"
        font-size="13" letter-spacing="1.5" fill="#2dd4bf">
    &gt; torrent_watchdog_for_*arr_ecosystems
  </text>
</svg>
