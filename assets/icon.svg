<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="32" fill="#090b0e"/>

  <!-- Subtle glow -->
  <ellipse cx="128" cy="128" rx="120" ry="120" fill="url(#glow)"/>

  <!-- Helm wheel + magnifying glass, centered at 128,128 -->
  <g transform="translate(128,128)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="56" fill="none" stroke="url(#g)" stroke-width="7"/>
    <!-- Hub -->
    <circle cx="0" cy="0" r="13" fill="none" stroke="url(#g)" stroke-width="7"/>
    <!-- 8 spokes -->
    <line x1="0"     y1="-13"  x2="0"     y2="-56"  stroke="url(#g)" stroke-width="7" stroke-linecap="round"/>
    <line x1="0"     y1="13"   x2="0"     y2="56"   stroke="url(#g)" stroke-width="7" stroke-linecap="round"/>
    <line x1="-13"   y1="0"    x2="-56"   y2="0"    stroke="url(#g)" stroke-width="7" stroke-linecap="round"/>
    <line x1="13"    y1="0"    x2="56"    y2="0"    stroke="url(#g)" stroke-width="7" stroke-linecap="round"/>
    <line x1="9.2"   y1="-9.2" x2="39.6"  y2="-39.6" stroke="url(#g)" stroke-width="7" stroke-linecap="round"/>
    <line x1="-9.2"  y1="9.2"  x2="-39.6" y2="39.6"  stroke="url(#g)" stroke-width="7" stroke-linecap="round"/>
    <line x1="9.2"   y1="9.2"  x2="39.6"  y2="39.6"  stroke="url(#g)" stroke-width="7" stroke-linecap="round"/>
    <line x1="-9.2"  y1="-9.2" x2="-39.6" y2="-39.6" stroke="url(#g)" stroke-width="7" stroke-linecap="round"/>
    <!-- Magnifying glass overlay -->
    <circle cx="24" cy="-24" r="20" fill="none" stroke="url(#g)" stroke-width="5.5"/>
    <line x1="38" y1="-10" x2="54" y2="6" stroke="url(#g)" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
