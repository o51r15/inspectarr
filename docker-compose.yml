services:
  inspectarr:
    image: ghcr.io/o51r15/inspectarr:dev
    # build: .  # uncomment for local builds
    container_name: inspectarr
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    ports:
      - "8585:8585"
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml
