services:
  inspectarr:
    image: ghcr.io/o51r15/inspectarr:dev
    # build: .  # uncomment for local builds
    container_name: inspectarr
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    # M-10: drop all Linux capabilities and prevent privilege escalation
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "8585:8585"
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml
      # Read-only so inspectarr can CONFIRM a payload is gone after a
      # delete. It never writes here; qBittorrent owns this tree.
      - /mnt/otherpool/downloads:/downloads:ro
    environment:
      # <path as the torrent client sees it>:<path as inspectarr sees it>
      - INSPECTARR_PATH_MAP=/downloads:/downloads
