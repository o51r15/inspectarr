      <!-- PANE: Config file -->
      <div class="settings-pane" data-pane="file">
        <div class="form-section">
          <div class="form-section-title flex items-center justify-between">
            <span>config.yaml</span>
            <a href="/config#system" class="btn btn-ghost btn-sm">Back to System</a>
          </div>
          <p class="hint mb-12">
            The whole configuration file, comments included. Saving here replaces the file
            with exactly what is below, after checking it loads. Stored passwords and keys
            show as <code>••••••••</code>: leave them as they are to keep them.
          </p>
          <form method="post" action="/config/save" id="file-form">
            <input type="hidden" name="edit_mode" value="yaml">
            <div class="form-group">
              <textarea class="mono minh-500" name="raw_yaml" rows="40" spellcheck="false"
                        aria-label="config.yaml">{{ raw_yaml }}</textarea>
            </div>
            <div class="flex gap-8 mt-16">
              <button type="submit" class="btn btn-primary">Save file</button>
              <button type="button" class="btn btn-ghost" data-action="call"
                      data-fn="discardFileEdits">Discard changes</button>
            </div>
          </form>
        </div>
      </div>
