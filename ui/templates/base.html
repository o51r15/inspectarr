<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}inspectarr{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <img src="/static/logo.svg" alt="inspectarr" class="sidebar-logo-mark">
      <div class="sidebar-brand-text">
        <span class="sidebar-brand-name">inspectarr</span>
        <span class="sidebar-brand-tag">&gt; watchdog</span>
      </div>
    </div>
    <nav class="nav">
      <a href="/" class="{{ 'active' if request.path == '/' else '' }}">
        <span class="icon">◈</span> Dashboard
      </a>
      <a href="/scheduler" class="{{ 'active' if request.path.startswith('/scheduler') else '' }}">
        <span class="icon">⏱</span> Scheduler
      </a>
      <a href="/torrents" class="{{ 'active' if request.path.startswith('/torrents') else '' }}">
        <span class="icon">⬇</span> Torrents
      </a>
      <a href="/indexers" class="{{ 'active' if request.path.startswith('/indexers') else '' }}">
        <span class="icon">⚖</span> Indexers
      </a>
      <a href="/stats" class="{{ 'active' if request.path.startswith('/stats') else '' }}">
        <span class="icon">⎇</span> Stats
      </a>
      <a href="/logs" class="{{ 'active' if request.path.startswith('/logs') else '' }}">
        <span class="icon">▣</span> Logs
      </a>
      <a href="/config" class="{{ 'active' if request.path.startswith('/config') else '' }}">
        <span class="icon">⚙</span> Config
      </a>
      {% if auth_enabled %}
      <a href="/logout">
        <span class="icon">◌</span> Log out
      </a>
      {% endif %}
    </nav>
    <a href="https://buymeacoffee.com/o51r15" target="_blank" rel="noopener"
       class="sidebar-donate" title="Support the project">☕ Donate</a>
    <a id="sidebar-version" href="https://github.com/o51r15/inspectarr/releases" target="_blank" rel="noopener"
       class="sidebar-version">v1.1.1</a>
  </aside>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <h2>{% block page_title %}{% endblock %}</h2>
      <div class="flex gap-8 items-center">{% block topbar_actions %}{% endblock %}</div>
    </div>
    <div class="page">
      {% block content %}{% endblock %}
    </div>
  </div>

</div>
<script src="/static/app.js"></script>
{% block scripts %}{% endblock %}
<div id="toast-container"></div>
<script>
  // Dynamic version — fetch latest GitHub release, cache per session
  (function() {
    const el = document.getElementById('sidebar-version');
    if (!el) return;
    const cached = sessionStorage.getItem('inspectarr_version');
    if (cached) { el.textContent = cached; return; }
    fetch('https://api.github.com/repos/o51r15/inspectarr/releases/latest')
      .then(r => r.ok ? r.json() : null)
      .then(d => {
        if (d && d.tag_name) {
          el.textContent = d.tag_name;
          sessionStorage.setItem('inspectarr_version', d.tag_name);
        }
      })
      .catch(() => {});  // silent fail — hardcoded fallback stays
  })();
</script>
</body>
</html>
